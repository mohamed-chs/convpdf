# Publishes to npm (trusted publishing, with provenance) and creates a GitHub
# release when a version tag is pushed:
#
#   npm version <x.y.z> --no-git-tag-version   # bump package.json, commit
#   git tag -a v<x.y.z> -m "<release notes>"   # the tag message becomes the notes
#   git push origin main v<x.y.z>
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json and is on main
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install Poppler (used by the PDF tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: npm ci
      - name: Type check and test
        shell: bash
        run: |
          npm run typecheck
          npm test 2>&1 | tee test-output.txt
          grep -q '^ℹ skipped 0$' test-output.txt

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          if npm view "convpdf@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Already published."
          else
            npm publish --provenance --access public --ignore-scripts
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout can leave a lightweight tag; fetch the annotated one.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          npm pack --ignore-scripts
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" convpdf-*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" convpdf-*.tgz --verify-tag --title "convpdf ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
