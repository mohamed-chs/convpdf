<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>convpdf</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<!--BOOT-->
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="toggle-sidebar" title="Toggle files (Ctrl+B)" aria-label="Toggle files">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <div class="brand"><img src="/favicon.svg" alt="" width="18" height="18">convpdf</div>
    <div class="doc-name" title="">
      <span id="doc-path">Untitled</span>
      <span class="dirty" id="dirty" title="Unsaved changes" hidden></span>
    </div>
    <div class="spacer"></div>
    <div class="controls" id="controls">
      <label class="select" title="Theme">
        <svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>
        <select id="opt-theme" aria-label="Theme"></select>
      </label>
      <label class="select" title="Paper size">
        <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
        <select id="opt-paper" aria-label="Paper size">
          <option value="A4">A4</option>
          <option value="Letter">Letter</option>
          <option value="Legal">Legal</option>
          <option value="A3">A3</option>
          <option value="A5">A5</option>
        </select>
      </label>
      <button class="toggle" id="opt-landscape" aria-pressed="false" title="Landscape orientation">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
        <span>Landscape</span>
      </button>
      <button class="toggle" id="opt-toc" aria-pressed="false" title="Table of contents">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Contents</span>
      </button>
    </div>
    <div class="segmented" role="tablist" aria-label="View">
      <button role="tab" id="mode-edit" class="narrow-only" aria-selected="false">Edit</button>
      <button role="tab" id="mode-preview" aria-selected="true">Preview</button>
      <button role="tab" id="mode-pdf" aria-selected="false">PDF</button>
    </div>
    <button class="primary" id="download" title="Download PDF (Ctrl+E)">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
      <span>PDF</span>
    </button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="root-name" id="root-name"></span>
      <button class="icon-btn small" id="new-file" title="New file" aria-label="New file">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="filter">
      <input id="filter" type="search" placeholder="Filter" aria-label="Filter files" autocomplete="off" spellcheck="false">
    </div>
    <nav class="tree" id="tree" aria-label="Files"></nav>
  </aside>

  <main class="workspace" id="workspace">
    <section class="pane editor-pane" id="editor" aria-label="Editor"></section>
    <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="-1"></div>
    <section class="pane preview-pane" id="preview-pane" aria-label="Preview">
      <iframe id="preview" title="Preview"></iframe>
      <iframe id="pdf" title="PDF" hidden></iframe>
      <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busy-text">Rendering PDF</span></div>
      <div class="error-banner" id="error" hidden></div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status-file"></span>
    <button class="warn-btn" id="status-warnings" hidden></button>
    <span class="spacer"></span>
    <span id="status-render"></span>
  </footer>

  <div class="popover" id="warnings-panel" hidden>
    <div class="popover-head">Warnings<button class="icon-btn small" id="close-warnings" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <ul id="warnings-list"></ul>
  </div>
  <div class="drop-overlay" id="drop" hidden><div>Drop a Markdown file to open it</div></div>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
